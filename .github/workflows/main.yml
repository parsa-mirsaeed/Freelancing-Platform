name: Main

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPOSITORY: ghcr.io/parsa-mirsaeed/freelancing-platform

concurrency:
  group: main
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: freelancing
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d freelancing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/freelancing
      REDIS_URL: redis://localhost:6379/15
      ELASTICSEARCH_URL: http://localhost:9200
      ELASTICSEARCH_INDEX_PREFIX: freelancing-main-${{ github.run_id }}
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: freelancing-main-${{ github.run_id }}
      SECRET_KEY: ci-only-secret
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Start MinIO
        run: >-
          docker run -d --rm --name minio-main
          -p 9000:9000
          -e MINIO_ROOT_USER=minioadmin
          -e MINIO_ROOT_PASSWORD=minioadmin
          minio/minio:latest server /data
      - name: Wait for MinIO
        run: |
          for attempt in $(seq 1 30); do
            if curl -fs http://localhost:9000/minio/health/live; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - run: ruff check app ci tests
      - run: ruff format --check app ci tests
      - run: mypy app ci
      - run: pytest -m unit tests/unit
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -m 'db or redis or search or socket or files' tests/integration

  image:
    needs: core
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REPOSITORY }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.IMAGE_REPOSITORY }}@${{ steps.build.outputs.digest }}
          artifact-name: sbom-${{ github.sha }}.spdx.json

  staging:
    needs: image
    if: vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.STAGING_KUBECONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Deploy exact main image digest
        env:
          IMAGE: ${{ env.IMAGE_REPOSITORY }}@${{ needs.image.outputs.digest }}
        run: |
          for target in \
            freelancing-api:api \
            freelancing-socket:socket \
            freelancing-worker:worker \
            celery-payments:worker \
            celery-notifications:worker \
            celery-search:worker \
            celery-files:worker; do
            deployment="${target%%:*}"
            container="${target##*:}"
            kubectl -n freelancing set image "deployment/$deployment" "$container=$IMAGE"
            kubectl -n freelancing rollout status "deployment/$deployment" --timeout=180s
          done
      - name: Staging smoke
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: curl --fail --silent --show-error "$STAGING_BASE_URL/health/ready"
