name: PR Gate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      domains: ${{ steps.impact.outputs.domains }}
      python: ${{ steps.impact.outputs.python }}
      database: ${{ steps.impact.outputs.database }}
      redis: ${{ steps.impact.outputs.redis }}
      search: ${{ steps.impact.outputs.search }}
      realtime: ${{ steps.impact.outputs.realtime }}
      files: ${{ steps.impact.outputs.files }}
      ci: ${{ steps.impact.outputs.ci }}
      docker: ${{ steps.impact.outputs.docker }}
      docs: ${{ steps.impact.outputs.docs }}
      k8s: ${{ steps.impact.outputs.k8s }}
      dependencies: ${{ steps.impact.outputs.dependencies }}
      frontend: ${{ steps.impact.outputs.frontend }}
      frontend_e2e: ${{ steps.impact.outputs.frontend_e2e }}
      frontend_dependencies: ${{ steps.impact.outputs.frontend_dependencies }}
      unit_targets: ${{ steps.impact.outputs.unit_targets }}
      integration_targets: ${{ steps.impact.outputs.integration_targets }}
      frontend_unit_targets: ${{ steps.impact.outputs.frontend_unit_targets }}
      frontend_e2e_targets: ${{ steps.impact.outputs.frontend_e2e_targets }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install impact detector dependency
        run: python -m pip install --disable-pip-version-check PyYAML~=6.0
      - name: Detect affected domains
        id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed-files.txt
          python ci/impact.py --paths-file /tmp/changed-files.txt --github-output

  metadata:
    name: Config validation
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check PyYAML~=6.0
      - run: python ci/impact.py --validate-config
      - run: python ci/validate_openapi.py
      - run: python ci/validate_adrs.py
      - run: python ci/validate_k8s.py
      - name: Lint GitHub Actions workflow syntax
        if: needs.changes.outputs.ci == 'true'
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color -shellcheck= -pyflakes=
      - run: python -m compileall -q ci

  quality:
    name: Python quality
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e '.[dev]' bandit
      - run: ruff check app ci tests
      - run: ruff format --check app ci tests
      - run: mypy app ci
      - run: bandit -q -r app

  unit:
    name: Affected unit tests
    needs: changes
    if: needs.changes.outputs.python == 'true' && needs.changes.outputs.unit_targets != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Run selected unit tests
        run: pytest -m unit ${{ needs.changes.outputs.unit_targets }}

  database:
    name: PostgreSQL migration + integration
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: freelancing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d freelancing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/freelancing
      SECRET_KEY: ci-only-secret
      APP_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - run: alembic upgrade head
      - run: alembic check
      - name: Run selected PostgreSQL integration tests
        run: pytest -m db ${{ needs.changes.outputs.integration_targets }}

  redis:
    name: Redis integration
    needs: changes
    if: needs.changes.outputs.redis == 'true'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/15
      SECRET_KEY: ci-only-secret
      APP_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - run: pytest -m redis tests/integration/test_redis.py

  realtime:
    name: Realtime Redis + Socket.IO integration
    needs: changes
    if: needs.changes.outputs.realtime == 'true'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/15
      SECRET_KEY: ci-only-secret
      APP_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - run: pytest -m socket tests/integration/test_realtime.py

  search:
    name: Elasticsearch integration
    needs: changes
    if: needs.changes.outputs.search == 'true'
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      ELASTICSEARCH_URL: http://localhost:9200
      ELASTICSEARCH_INDEX_PREFIX: freelancing-pr-${{ github.run_id }}
      SECRET_KEY: ci-only-secret
      APP_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - run: pytest -m search tests/integration/test_search.py

  files:
    name: MinIO file integration
    needs: changes
    if: needs.changes.outputs.files == 'true'
    runs-on: ubuntu-latest
    env:
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: freelancing-pr-${{ github.run_id }}
      SECRET_KEY: ci-only-secret
      APP_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Start MinIO
        run: >-
          docker run -d --rm --name minio-pr
          -p 9000:9000
          -e MINIO_ROOT_USER=minioadmin
          -e MINIO_ROOT_PASSWORD=minioadmin
          minio/minio:latest server /data
      - name: Wait for MinIO
        run: |
          for attempt in $(seq 1 30); do
            if curl -fs http://localhost:9000/minio/health/live; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - run: pytest -m files tests/integration/test_files.py

  docs:
    name: Markdown hygiene
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python ci/check_markdown.py

  k8s:
    name: Kubernetes policy validation
    needs: changes
    if: needs.changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check PyYAML~=6.0
      - run: python ci/validate_k8s.py

  dependencies:
    name: Python dependency audit
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e . pip-audit
      - run: pip-audit

  docker:
    name: Container build + security scan
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: freelancing-platform:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: freelancing-platform:pr
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  frontend:
    name: Frontend quality + build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.11.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Run selected frontend unit tests
        if: needs.changes.outputs.frontend_unit_targets != ''
        run: npm exec -- vitest run ${{ needs.changes.outputs.frontend_unit_targets }}
      - run: npm run build

  frontend-e2e:
    name: Frontend Chromium smoke
    needs: changes
    if: needs.changes.outputs.frontend_e2e == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.11.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run selected frontend browser tests
        if: needs.changes.outputs.frontend_e2e_targets != ''
        run: npm exec -- playwright test ${{ needs.changes.outputs.frontend_e2e_targets }}

  frontend-dependencies:
    name: Frontend dependency audit
    needs: changes
    if: needs.changes.outputs.frontend_dependencies == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.11.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high

  gate:
    name: gate
    if: always()
    needs:
      - changes
      - metadata
      - quality
      - unit
      - database
      - redis
      - realtime
      - search
      - files
      - docs
      - k8s
      - dependencies
      - docker
      - frontend
      - frontend-e2e
      - frontend-dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify aggregate result
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python ci/verify_gate.py
