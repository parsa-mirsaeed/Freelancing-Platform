apiVersion: v1
kind: ServiceAccount
metadata:
  name: freelancing-socket
  namespace: freelancing
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freelancing-socket
  namespace: freelancing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: freelancing-socket
  template:
    metadata:
      labels:
        app: freelancing-socket
    spec:
      serviceAccountName: freelancing-socket
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: socket
          image: ghcr.io/parsa-mirsaeed/freelancing-platform:main
          imagePullPolicy: IfNotPresent
          command:
            - gunicorn
            - --bind=0.0.0.0:8000
            - --workers=1
            - --threads=8
            - --access-logfile=-
            - --error-logfile=-
            - app:create_app()
          ports:
            - name: socket
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: freelancing-runtime
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: freelancing-runtime-secrets
                  key: secret-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: freelancing-runtime-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: freelancing-runtime-secrets
                  key: redis-url
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: socket
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: socket
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/startup
              port: socket
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: freelancing-socket
  namespace: freelancing
spec:
  selector:
    app: freelancing-socket
  ports:
    - name: socket
      port: 80
      targetPort: socket
---
apiVersion: apps/v1
kind: Deployment
metadata:
