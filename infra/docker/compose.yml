services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: freelancing
      POSTGRES_USER: freelancing
      POSTGRES_PASSWORD: freelancing
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freelancing -d freelancing"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
    environment:
      APP_ENV: development
      SECRET_KEY: local-development-secret-change-me
      DATABASE_URL: postgresql+psycopg://freelancing:freelancing@postgres:5432/freelancing
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
