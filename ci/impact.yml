domains:
  bootstrap:
    paths:
      - app/__init__.py
      - app/celery.py
      - app/celery_worker.py
    unit:
      - tests/unit/test_app.py
    integration:
      - tests/integration/test_database.py
    flags: [python, database, realtime]
  shared:
    paths:
      - app/config.py
      - app/extensions.py
      - app/errors.py
      - app/common/**
      - pyproject.toml
    unit:
      - tests/unit
    flags: [python, database, redis, search, realtime, files]
  identity:
    paths:
      - app/identity/**
      - tests/unit/identity/**
    unit:
      - tests/unit/identity
    integration:
      - tests/integration/test_database.py
    flags: [python, database]
  audit:
    paths:
      - app/audit/**
      - tests/unit/audit/**
    unit:
      - tests/unit/audit
    integration:
      - tests/integration/test_database.py
    flags: [python, database]
  freelancers:
    paths:
      - app/freelancers/**
      - tests/unit/freelancers/**
    unit:
      - tests/unit/freelancers
    integration:
      - tests/integration/test_database.py
    flags: [python, database, search]
  portfolios:
    paths:
      - app/portfolios/**
      - tests/unit/portfolios/**
    unit:
      - tests/unit/portfolios
    integration:
      - tests/integration/test_database.py
    flags: [python, database, search]
  gigs:
    paths:
      - app/gigs/**
      - tests/unit/gigs/**
    unit:
      - tests/unit/gigs
    integration:
      - tests/integration/test_database.py
    flags: [python, database]
  projects:
    paths:
      - app/projects/**
      - tests/unit/projects/**
    unit:
      - tests/unit/projects
    integration:
      - tests/integration/test_database.py
      - tests/integration/test_money.py
    flags: [python, database, search]
  proposals:
    paths:
      - app/proposals/**
      - tests/unit/proposals/**
    unit:
      - tests/unit/proposals
    integration:
      - tests/integration/test_database.py
    flags: [python, database, search]
  contracts:
    paths:
      - app/contracts/**
      - tests/unit/contracts/**
      - tests/integration/test_contracts.py
    unit:
      - tests/unit/contracts
    integration:
      - tests/integration/test_contracts.py
    flags: [python, database]
  milestones:
    paths:
      - app/milestones/**
      - tests/unit/milestones/**
    unit:
      - tests/unit/milestones
    integration:
      - tests/integration/test_contracts.py
      - tests/integration/test_money.py
    flags: [python, database]
  payments:
    paths:
      - app/payments/**
      - tests/unit/payments/**
      - tests/integration/test_money.py
    unit:
      - tests/unit/payments
    integration:
      - tests/integration/test_money.py
    flags: [python, database]
  ledger:
    paths:
      - app/ledger/**
      - tests/unit/ledger/**
    unit:
      - tests/unit/ledger
    integration:
      - tests/integration/test_money.py
    flags: [python, database]
  payouts:
    paths:
      - app/payouts/**
      - tests/unit/payouts/**
    unit:
      - tests/unit/payments
    integration:
      - tests/integration/test_money.py
    flags: [python, database]
  disputes:
    paths:
      - app/disputes/**
      - tests/unit/disputes/**
      - tests/integration/test_disputes.py
    unit:
      - tests/unit/disputes
    integration:
      - tests/integration/test_disputes.py
    flags: [python, database]
  calls:
    paths:
      - app/calls/**
      - tests/unit/calls/**
      - tests/integration/test_calls.py
    unit:
      - tests/unit/calls
    integration:
      - tests/integration/test_calls.py
    flags: [python, database, realtime]
  messaging:
    paths:
      - app/messaging/**
      - tests/unit/messaging/**
      - tests/integration/test_communication.py
    unit:
      - tests/unit/messaging
    integration:
      - tests/integration/test_communication.py
    flags: [python, database, realtime]
  realtime:
    paths:
      - app/realtime/**
      - tests/unit/realtime/**
      - tests/integration/test_realtime.py
    unit:
      - tests/unit/realtime
    flags: [python, realtime]
  notifications:
    paths:
      - app/notifications/**
      - tests/unit/notifications/**
    unit:
      - tests/unit/notifications
    integration:
      - tests/integration/test_communication.py
    flags: [python, database]
  files:
    paths:
      - app/files/**
      - tests/unit/files/**
      - tests/integration/test_files.py
    unit:
      - tests/unit/files
    integration:
      - tests/integration/test_communication.py
    flags: [python, database, files]
  reviews:
    paths:
      - app/reviews/**
      - tests/unit/reviews/**
    unit:
      - tests/unit/reviews
    integration:
      - tests/integration/test_database.py
    flags: [python, database, search]
  search:
    paths:
      - app/search/**
      - tests/unit/search/**
      - tests/integration/test_search.py
    unit:
      - tests/unit/search
    integration:
      - tests/integration/test_search.py
    flags: [python, search]
  database:
    paths:
      - migrations/**
      - alembic.ini
    integration:
      - tests/integration/test_database.py
      - tests/integration/test_contracts.py
      - tests/integration/test_money.py
      - tests/integration/test_communication.py
      - tests/integration/test_disputes.py
      - tests/integration/test_calls.py
    flags: [python, database]
  ci:
    paths:
      - ci/**
      - .github/**
    flags: [ci]
  docker:
    paths:
      - Dockerfile
      - infra/docker/**
    flags: [docker]
  docs:
    paths:
      - README.md
      - docs/**
    flags: [docs]
