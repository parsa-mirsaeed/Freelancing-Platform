domains:
  bootstrap:
    paths:
      - app/__init__.py
      - app/celery.py
      - app/celery_worker.py
    unit:
      - tests/unit/test_app.py
    integration:
      - tests/integration/test_database.py
    flags: [python, database]
  shared:
    paths:
      - app/config.py
      - app/extensions.py
      - app/errors.py
      - app/common/**
      - app/security.py
      - app/observability.py
      - app/feature_flags.py
    unit:
      - tests/unit
    flags: [python, database, redis, search, realtime, files]
  identity:
    paths:
      - app/identity/**
      - tests/unit/identity/**
    unit:
      - tests/unit/identity
    integration:
      - tests/integration/test_database.py
    flags: [python, database]
  audit:
    paths:
      - app/audit/**
      - tests/unit/audit/**
    unit:
      - tests/unit/audit
    integration:
      - tests/integration/test_database.py
    flags: [python, database]
  freelancers:
    paths:
      - app/freelancers/**
      - tests/unit/freelancers/**
    unit:
      - tests/unit/freelancers
    integration:
      - tests/integration/test_database.py
    flags: [python, database, search]
  portfolios:
    paths:
      - app/portfolios/**
      - tests/unit/portfolios/**
    unit:
      - tests/unit/portfolios
    integration:
      - tests/integration/test_database.py
    flags: [python, database, search]
  gigs:
    paths:
      - app/gigs/**
      - tests/unit/gigs/**
    unit:
      - tests/unit/gigs
    integration:
      - tests/integration/test_database.py
    flags: [python, database]
  projects:
    paths:
      - app/projects/**
      - tests/unit/projects/**
    unit:
      - tests/unit/projects
    integration:
      - tests/integration/test_database.py
      - tests/integration/test_money.py
    flags: [python, database, search]
  proposals:
    paths:
      - app/proposals/**
      - tests/unit/proposals/**
    unit:
      - tests/unit/proposals
    integration:
      - tests/integration/test_database.py
    flags: [python, database, search]
  contracts:
    paths:
      - app/contracts/**
      - tests/unit/contracts/**
      - tests/integration/test_contracts.py
    unit:
      - tests/unit/contracts
    integration:
      - tests/integration/test_contracts.py
    flags: [python, database]
  milestones:
    paths:
      - app/milestones/**
      - tests/unit/milestones/**
    unit:
      - tests/unit/milestones
    integration:
      - tests/integration/test_contracts.py
      - tests/integration/test_money.py
    flags: [python, database]
  payments:
    paths:
      - app/payments/**
      - tests/unit/payments/**
      - tests/integration/test_money.py
    unit:
      - tests/unit/payments
    integration:
      - tests/integration/test_money.py
    flags: [python, database]
  ledger:
    paths:
      - app/ledger/**
      - tests/unit/ledger/**
    unit:
      - tests/unit/ledger
    integration:
      - tests/integration/test_money.py
    flags: [python, database]
  payouts:
    paths:
      - app/payouts/**
      - tests/unit/payouts/**
    unit:
      - tests/unit/payments
    integration:
      - tests/integration/test_money.py
    flags: [python, database]
  disputes:
    paths:
      - app/disputes/**
      - tests/unit/disputes/**
      - tests/integration/test_disputes.py
    unit:
      - tests/unit/disputes
    integration:
      - tests/integration/test_disputes.py
    flags: [python, database]
  calls:
    paths:
      - app/calls/**
      - tests/unit/calls/**
      - tests/integration/test_calls.py
    unit:
      - tests/unit/calls
    integration:
      - tests/integration/test_calls.py
    flags: [python, database, realtime]
  messaging:
    paths:
      - app/messaging/**
      - tests/unit/messaging/**
      - tests/integration/test_communication.py
    unit:
      - tests/unit/messaging
    integration:
      - tests/integration/test_communication.py
    flags: [python, database, realtime]
  realtime:
    paths:
      - app/realtime/**
      - tests/unit/realtime/**
      - tests/integration/test_realtime.py
    unit:
      - tests/unit/realtime
    flags: [python, realtime]
  notifications:
    paths:
      - app/notifications/**
      - tests/unit/notifications/**
    unit:
      - tests/unit/notifications
    integration:
      - tests/integration/test_communication.py
    flags: [python, database]
  files:
    paths:
      - app/files/**
      - tests/unit/files/**
      - tests/integration/test_files.py
    unit:
      - tests/unit/files
    integration:
      - tests/integration/test_communication.py
    flags: [python, database, files]
  reviews:
    paths:
      - app/reviews/**
      - tests/unit/reviews/**
    unit:
      - tests/unit/reviews
    integration:
      - tests/integration/test_database.py
    flags: [python, database, search]
  search:
    paths:
      - app/search/**
      - tests/unit/search/**
      - tests/integration/test_search.py
    unit:
      - tests/unit/search
    integration:
      - tests/integration/test_search.py
    flags: [python, search]
  recommendations:
    paths:
      - app/recommendations/**
      - tests/unit/recommendations/**
    unit:
      - tests/unit/recommendations
    integration:
      - tests/integration/test_ai.py
      - tests/integration/test_search.py
    flags: [python, database, search]
  fraud:
    paths:
      - app/fraud/**
      - tests/unit/fraud/**
    unit:
      - tests/unit/fraud
    integration:
      - tests/integration/test_ai.py
    flags: [python, database]
  database:
    paths:
      - migrations/**
      - alembic.ini
    integration:
      - tests/integration/test_database.py
      - tests/integration/test_contracts.py
      - tests/integration/test_money.py
      - tests/integration/test_communication.py
      - tests/integration/test_disputes.py
      - tests/integration/test_calls.py
      - tests/integration/test_ai.py
    flags: [python, database]
  dependencies:
    paths:
      - pyproject.toml
    unit:
      - tests/unit
    integration:
      - tests/integration
    flags: [python, database, redis, search, realtime, files, dependencies]
  frontend:
    paths:
      - frontend/src/**
      - frontend/tests/**
      - frontend/next.config.ts
      - frontend/tsconfig.json
      - frontend/eslint.config.mjs
      - frontend/vitest.config.ts
      - frontend/playwright.config.ts
      - frontend/next-env.d.ts
      - frontend/.env.example
      - frontend/package.json
      - frontend/.npmrc
      - frontend/package-lock.json
    frontend_unit:
      - tests/unit/intl.test.ts
      - tests/unit/proxy-policy.test.ts
    frontend_e2e:
      - tests/e2e/smoke.spec.ts
    flags: [frontend, frontend_e2e]
  frontend-discovery:
    paths:
      - frontend/src/app/talent/**
      - frontend/src/app/(dashboard)/dashboard/profile/**
      - frontend/src/features/profile/**
      - frontend/src/lib/api/marketplace.ts
      - frontend/src/lib/server/marketplace.ts
      - frontend/tests/unit/marketplace.test.ts
      - frontend/tests/e2e/discovery.spec.ts
      - frontend/tests/e2e/mock-backend.mjs
    frontend_unit:
      - tests/unit/marketplace.test.ts
    frontend_e2e:
      - tests/e2e/discovery.spec.ts
    flags: [frontend, frontend_e2e]
  frontend-work:
    paths:
      - frontend/src/app/services/**
      - frontend/src/app/projects/**
      - frontend/src/app/(dashboard)/dashboard/gigs/**
      - frontend/src/app/(dashboard)/dashboard/projects/**
      - frontend/src/features/work/**
      - frontend/src/lib/api/product-client.ts
      - frontend/src/lib/api/work.ts
      - frontend/src/lib/server/work.ts
      - frontend/src/components/dashboard/dashboard-client.tsx
      - frontend/src/components/shell/site-header.tsx
      - frontend/tests/unit/work.test.ts
      - frontend/tests/e2e/work.spec.ts
      - frontend/tests/e2e/mock-backend.mjs
    frontend_unit:
      - tests/unit/work.test.ts
    frontend_e2e:
      - tests/e2e/work.spec.ts
    flags: [frontend, frontend_e2e]
  frontend-proposals:
    paths:
      - frontend/src/app/projects/*/proposal/**
      - frontend/src/app/(dashboard)/dashboard/projects/*/proposals/**
      - frontend/src/app/(dashboard)/dashboard/proposals/**
      - frontend/src/features/proposals/**
      - frontend/src/lib/api/proposals.ts
      - frontend/tests/unit/proposals.test.ts
      - frontend/tests/e2e/proposals.spec.ts
    frontend_unit:
      - tests/unit/proposals.test.ts
    frontend_e2e:
      - tests/e2e/proposals.spec.ts
    flags: [frontend, frontend_e2e]
  frontend-contracts:
    paths:
      - frontend/src/app/(dashboard)/dashboard/contracts/**
      - frontend/src/app/(dashboard)/dashboard/projects/*/contract/**
      - frontend/src/features/contracts/**
      - frontend/src/lib/api/contracts.ts
      - frontend/tests/unit/contracts.test.ts
      - frontend/tests/e2e/contracts.spec.ts
    frontend_unit:
      - tests/unit/contracts.test.ts
    frontend_e2e:
      - tests/e2e/contracts.spec.ts
    flags: [frontend, frontend_e2e]
  frontend-money:
    paths:
      - frontend/src/app/(dashboard)/dashboard/wallet/**
      - frontend/src/app/(dashboard)/dashboard/contracts/*/page.tsx
      - frontend/src/app/(dashboard)/dashboard/projects/*/contract/**
      - frontend/src/features/money/**
      - frontend/src/lib/api/money.ts
      - frontend/src/components/dashboard/dashboard-client.tsx
      - frontend/tests/unit/money.test.ts
      - frontend/tests/e2e/money.spec.ts
    frontend_unit:
      - tests/unit/money.test.ts
    frontend_e2e:
      - tests/e2e/money.spec.ts
    flags: [frontend, frontend_e2e]
  frontend-dependencies:
    paths:
      - frontend/package.json
      - frontend/.npmrc
      - frontend/package-lock.json
    frontend_unit:
      - tests/unit/intl.test.ts
      - tests/unit/proxy-policy.test.ts
    frontend_e2e:
      - tests/e2e/smoke.spec.ts
    flags: [frontend, frontend_e2e, frontend_dependencies]
  ci:
    paths:
      - ci/**
      - tests/unit/test_impact.py
    unit:
      - tests/unit/test_impact.py
    flags: [ci, python]
  workflows:
    paths:
      - .github/**
    flags: [ci]
  docker:
    paths:
      - Dockerfile
      - infra/docker/**
    flags: [docker]
  kubernetes:
    paths:
      - infra/kubernetes/**
    flags: [k8s]
  docs:
    paths:
      - README.md
      - docs/**
      - frontend/README.md
    flags: [docs]
