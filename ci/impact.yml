domains:
  bootstrap:
    paths:
      - app/__init__.py
    unit:
      - tests/unit
    integration:
      - tests/integration/test_database.py
    flags: [python, database]
  shared:
    paths:
      - app/config.py
      - app/extensions.py
      - app/errors.py
      - app/common/**
      - pyproject.toml
    unit:
      - tests/unit
    flags: [python, database, redis, search]
  identity:
    paths:
      - app/identity/**
      - tests/unit/identity/**
    unit:
      - tests/unit/identity
    integration:
      - tests/integration/test_database.py
    flags: [python, database]
  audit:
    paths:
      - app/audit/**
      - tests/unit/audit/**
    unit:
      - tests/unit/audit
    integration:
      - tests/integration/test_database.py
    flags: [python, database]
  freelancers:
    paths:
      - app/freelancers/**
      - tests/unit/freelancers/**
    unit:
      - tests/unit/freelancers
    integration:
      - tests/integration/test_database.py
    flags: [python, database, search]
  portfolios:
    paths:
      - app/portfolios/**
      - tests/unit/portfolios/**
    unit:
      - tests/unit/portfolios
    integration:
      - tests/integration/test_database.py
    flags: [python, database, search]
  gigs:
    paths:
      - app/gigs/**
      - tests/unit/gigs/**
    unit:
      - tests/unit/gigs
    integration:
      - tests/integration/test_database.py
    flags: [python, database]
  projects:
    paths:
      - app/projects/**
      - tests/unit/projects/**
    unit:
      - tests/unit/projects
    integration:
      - tests/integration/test_database.py
    flags: [python, database, search]
  proposals:
    paths:
      - app/proposals/**
      - tests/unit/proposals/**
    unit:
      - tests/unit/proposals
    integration:
      - tests/integration/test_database.py
    flags: [python, database, search]
  contracts:
    paths:
      - app/contracts/**
      - tests/unit/contracts/**
      - tests/integration/test_contracts.py
    unit:
      - tests/unit/contracts
    integration:
      - tests/integration/test_contracts.py
    flags: [python, database]
  milestones:
    paths:
      - app/milestones/**
      - tests/unit/milestones/**
    unit:
      - tests/unit/milestones
    integration:
      - tests/integration/test_contracts.py
    flags: [python, database]
  reviews:
    paths:
      - app/reviews/**
      - tests/unit/reviews/**
    unit:
      - tests/unit/reviews
    integration:
      - tests/integration/test_database.py
    flags: [python, database, search]
  search:
    paths:
      - app/search/**
      - tests/unit/search/**
      - tests/integration/test_search.py
    unit:
      - tests/unit/search
    integration:
      - tests/integration/test_search.py
    flags: [python, search]
  database:
    paths:
      - migrations/**
      - alembic.ini
    integration:
      - tests/integration/test_database.py
    flags: [python, database]
  ci:
    paths:
      - ci/**
      - .github/workflows/**
    flags: [ci]
  docker:
    paths:
      - Dockerfile
      - infra/docker/**
    flags: [docker]
  docs:
    paths:
      - README.md
      - docs/**
    flags: [docs]
