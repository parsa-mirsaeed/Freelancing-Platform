openapi: 3.1.0
info:
  title: Freelancing Platform Money API
  version: 0.5.0
paths:
  /api/v1/milestones/{milestone_id}/financials:
    get:
      summary: Read ledger-derived milestone escrow state
      parameters:
        - $ref: '#/components/parameters/MilestoneId'
      responses:
        '200':
          description: Financial state
  /api/v1/milestones/{milestone_id}/fund:
    post:
      summary: Create or reuse the single active idempotent provider funding attempt
      parameters:
        - $ref: '#/components/parameters/MilestoneId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Payment pending provider capture or reuse of the active provider attempt
        '409':
          description: Another provider already has an active funding attempt for the milestone
  /api/v1/payment-intents/{payment_intent_id}/action:
    get:
      summary: Retrieve the owning employer's ephemeral provider payment action
      parameters:
        - name: payment_intent_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Provider action or null when no customer action remains
        '403':
          description: Payment intent belongs to another employer
        '404':
          description: Payment intent not found
  /api/v1/milestones/{milestone_id}/release:
    post:
      summary: Release approved milestone escrow to wallet and platform commission
      parameters:
        - $ref: '#/components/parameters/MilestoneId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Milestone released or idempotent replay
  /api/v1/milestones/{milestone_id}/refund:
    post:
      summary: Fully refund a funded milestone before work starts
      parameters:
        - $ref: '#/components/parameters/MilestoneId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Refund succeeded or terminal idempotent replay
        '202':
          description: Provider refund remains pending; retry with the same idempotency key
        '502':
          description: Provider refund failed and ledger reservation was reversed
  /api/v1/payments/webhooks/{provider}:
    post:
      summary: Receive a signed provider webhook using the provider-specific signature header
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event processed, ignored safely, or duplicate
        '401':
          description: Signature verification failed
        '409':
          description: Event identity or commercial terms conflict
  /api/v1/wallet:
    get:
      summary: Read freelancer balances derived from ledger entries
      responses:
        '200':
          description: Currency balances
  /api/v1/payouts:
    post:
      summary: Create an idempotent payout from available wallet funds
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Payout succeeded or terminal idempotent replay
        '409':
          description: Insufficient balance or payout destination is not configured
        '502':
          description: Provider payout failed and reservation was reversed
        '503':
          description: Provider outcome is unknown; reservation remains pending and the same key must be retried
  /api/v1/admin/freelancers/{freelancer_user_id}/payout-provider-accounts/{provider}:
    put:
      summary: Verify and configure a freelancer payout destination
      parameters:
        - $ref: '#/components/parameters/FreelancerUserId'
        - $ref: '#/components/parameters/ProviderName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_account_reference]
              additionalProperties: false
              properties:
                external_account_reference:
                  type: string
                  minLength: 1
                  maxLength: 255
      responses:
        '200':
          description: Verified provider account configured and active
        '403':
          description: Admin role with recent MFA is required
        '409':
          description: Provider destination is not payout-ready or belongs to another freelancer
    delete:
      summary: Disable a freelancer payout destination
      parameters:
        - $ref: '#/components/parameters/FreelancerUserId'
        - $ref: '#/components/parameters/ProviderName'
      responses:
        '200':
          description: Provider account disabled
        '403':
          description: Admin role with recent MFA is required
        '404':
          description: Provider account not found
components:
  parameters:
    MilestoneId:
      name: milestone_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FreelancerUserId:
      name: freelancer_user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProviderName:
      name: provider
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 40
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
