[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "freelancing-platform"
version = "0.2.0"
description = "Modular Flask backend for a skill-sharing and freelancing marketplace"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1,<4",
  "Flask-SQLAlchemy>=3.1,<4",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<7",
  "celery[redis]>=5.4,<6",
  "PyJWT>=2.9,<3",
  "argon2-cffi>=23,<26",
  "gunicorn>=23,<24",
  "elasticsearch>=9.4,<10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "mypy>=1.13,<2",
  "PyYAML>=6,<7",
  "types-PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
include = ["app*", "ci*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "unit: fast isolated tests",
  "db: tests that require a real PostgreSQL service",
  "redis: tests that require a real Redis service",
  "search: tests that require a real Elasticsearch service",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = []
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true
