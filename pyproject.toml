[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "freelancing-platform"
version = "0.3.0"
description = "Modular Flask backend for a skill-sharing and freelancing marketplace"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1,<4",
  "Flask-SQLAlchemy>=3.1,<4",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<7",
  "celery[redis]>=5.4,<6",
  "PyJWT>=2.9,<3",
  "argon2-cffi>=23,<26",
  "gunicorn>=23,<24",
  "elasticsearch>=9.4,<10",
  "Flask-SocketIO>=5.5,<6",
  "simple-websocket>=1.1,<2",
  "boto3>=1.40,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "requests>=2.32,<3",
  "ruff>=0.9,<1",
  "mypy>=1.13,<2",
  "PyYAML>=6,<7",
  "types-PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
include = ["app*", "ci*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "unit: fast isolated tests",
  "db: tests that require a real PostgreSQL service",
  "redis: tests that require a real Redis service",
  "search: tests that require a real Elasticsearch service",
  "socket: tests that require Redis and Socket.IO servers",
  "files: tests that require S3-compatible object storage",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = []
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = [
  "celery.*",
  "flask_socketio.*",
  "boto3.*",
  "botocore.*",
]
ignore_missing_imports = true
